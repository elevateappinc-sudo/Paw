<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paw</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b1220;
      color: #e5e9f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      gap: 16px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img { width: 44px; height: 44px; }
    h1 { font-size: 22px; font-weight: 700; }
    p { font-size: 15px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 14px 28px;
      min-height: 44px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #0b1220;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="icon.svg" alt="Paw" /></div>
    <h1>Sin conexión</h1>
    <p>Revisa tu conexión a internet para abrir Paw. Vuelve a intentarlo en un momento.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
